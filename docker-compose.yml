services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mevova-handyman
    restart: always
    ports:
      - "3000:3000"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    # Optional: configure logging limits to prevent disk filling up
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
